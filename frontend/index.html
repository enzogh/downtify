<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=castify: a CDN or browser may still hold the Downtify icons
         under the bare URLs; bump it whenever the icons change. -->
    <link rel="icon" href="/favicon.ico?v=castify" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=castify" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=castify" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=castify" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=castify" />
    <link rel="manifest" href="/manifest.json" />
    <!-- An app, not a page: no pinch or double-tap zoom, and no jump in
         when a small input gets focus (iOS). See src/lib/noZoom.js. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1ad05c" />

    <!-- iOS home-screen "add to home screen" doesn't read manifest.json
         (display: standalone) or theme-color at all — Safari needs these
         Apple-specific tags to launch as a standalone app instead of a
         browser tab with the URL bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Castify" />

    <title>Castify</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
